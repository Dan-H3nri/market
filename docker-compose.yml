services:
  engine:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./memory:/app/memory
    command: uvicorn app.api:app --host 0.0.0.0 --port 8001

  frontend:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - engine
